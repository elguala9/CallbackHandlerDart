name: callback_handler_monorepo
repository: https://github.com/example/callback_handler_monorepo

packages:
  - packages/**

scripts:
  analyze:
    run: melos exec -- dart analyze
    description: Analyze all packages

  format:
    run: melos exec -- dart format .
    description: Format all packages

  test:
    run: melos exec -- dart test
    description: Run tests for all packages

  clean:
    run: melos clean && melos get
    description: Clean and reinstall all packages
